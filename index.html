<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183a36">
<title>竹南尋寶隊</title>
<style>
:root{color-scheme:light;--ink:#193a36;--muted:#4f695f;--paper:#fffdf2;--teal:#145b52;--orange:#a84420;--purple:#603d91;font-family:system-ui,"Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#173731;color:var(--ink)}
h1,h2,p,ol{margin:0}button{font:inherit;font-weight:800;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default}
:focus-visible{outline:3px solid #8057c3;outline-offset:3px}[hidden]{display:none!important}
.game{height:100svh;max-width:570px;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,.85fr);position:relative;isolation:isolate;overflow:hidden;padding:env(safe-area-inset-top) 12px max(10px,env(safe-area-inset-bottom));gap:10px;background:#ac9b79}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 1px;color:white;font-size:.86rem;font-weight:850;text-shadow:0 1px 3px #332b21}
.badge{display:flex;align-items:center;gap:6px}
.badge b{display:grid;place-items:center;width:28px;height:28px;background:#174b42;border-radius:9px;border:1px solid #b0d0b2;color:#e8f8d9}
.album{display:flex;align-items:center;gap:6px;min-height:39px;padding:3px 9px;border:1px solid #deccec;border-radius:9px;background:#f5edf8;color:#522f81;font-size:.82rem}
.album:disabled{opacity:.84}.shard{display:inline-block;width:16px;height:21px;clip-path:polygon(55% 0,96% 27%,95% 69%,53% 100%,7% 73%,5% 34%);background:conic-gradient(from 35deg,#f8d7ff,#a777e0,#5f37a6,#b482e6,#f8d7ff)}
.board{min-height:0;display:flex;flex-direction:column;border:6px solid #a8b7ad;border-top-color:#edf0df;border-left-color:#cbd5c5;border-bottom-color:#7a9687;border-radius:7px;background:linear-gradient(140deg,#fffefa,#f5f4e7);box-shadow:0 6px 18px #10292754}
.board-head{flex:none;display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;padding:8px 10px 6px;border-bottom:1px solid #dbe2d4}
.board-head p{font-size:.76rem;font-weight:800;color:var(--muted)}
.route{grid-column:1/-1;display:flex;justify-content:space-between;gap:2px;padding:0;list-style:none}
.route li{display:grid;place-items:center;min-width:0;width:min(8vw,26px);aspect-ratio:1;border:1px solid #d8decf;border-radius:50%;background:#eeefe5;color:#4f6357;font-size:.66rem;font-weight:850}
.route .now{background:#a84420;color:white;border-color:#a84420}
.route .win{background:#176653;color:white;border-color:#176653}
.route .miss,.route .late{background:#f2ddce;color:#814224;border-color:#e9c5ac}
.board-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:11px 12px;scrollbar-width:thin}
.question-label{display:inline-flex;margin:0 0 7px;padding:2px 8px;border-radius:4px;color:#754118;background:#f4e3c4;font-size:.75rem;font-weight:850}
.question{font-size:clamp(1.08rem,5vw,1.48rem);line-height:1.48;overflow-wrap:anywhere}
.title{font-size:clamp(2rem,10vw,3.4rem);font-weight:950;letter-spacing:-.06em;line-height:1.05}.title span{color:var(--orange)}
.cover,.outro{display:grid;place-content:center;text-align:center;min-height:100%;gap:7px}.cover p,.outro p{font-size:.85rem;color:var(--muted)}
.map{position:relative;width:min(100%,265px);margin:2px auto 0;display:grid;place-items:center;min-height:65px;border-radius:5px;border:1px solid #d7bd90;background:repeating-radial-gradient(ellipse at 18% 94%,transparent 0 9px,#a5793832 10px 11px,transparent 12px 21px),linear-gradient(135deg,#fff0cc,#ebcd96);box-shadow:2px 3px #d7c09b;transform:rotate(-2deg)}
.map::before{content:"";position:absolute;inset:15% 10%;border:2px dashed #9766388a;border-radius:51% 32% 55% 35%;transform:rotate(8deg)}
.map .chest{--size:clamp(110px,33vw,155px)}
.desk{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;border:1px solid #d29c65;border-bottom:6px solid #88552f;border-radius:11px;background:repeating-linear-gradient(3deg,#fff4 0 1px,transparent 2px 37px),linear-gradient(117deg,#e6c094,#cd9965);box-shadow:0 6px 17px #38261960;padding:8px;display:flex;flex-direction:column;gap:7px}
.desk>*{flex-shrink:0}
.launch{margin:auto 0;display:grid;gap:8px}.brief{background:#fff7df;padding:8px 10px;border:1px solid #e3cfa5;border-radius:7px;font-size:.83rem;color:#593d26;line-height:1.5}
.main-button{width:100%;min-height:44px;padding:8px;border:1px solid #0d5148;border-radius:8px;background:#146458;color:#fff;box-shadow:0 3px #113a32}
.main-button:active{transform:translateY(2px);box-shadow:0 1px #113a32}
.clock{position:sticky;top:-8px;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 49px;align-items:center;gap:9px;padding:5px 7px;border-radius:7px;background:#f9eed6;color:#3e563d;font-size:.76rem;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
.clock progress{width:100%;height:7px;accent-color:#176c58}.clock.urgent{color:#a32c17}.clock.urgent progress{accent-color:#a32c17}
.choices{display:grid;gap:5px}.choices.binary{grid-template-columns:1fr 1fr}
.option{display:flex;align-items:center;gap:7px;border:1px solid #a58059;background:#fffbee;box-shadow:0 1px #a58059;border-radius:7px;min-height:43px;padding:5px 7px;text-align:left;font-size:.88rem;line-height:1.3}
.option:not([hidden]){animation:rise .18s ease-out}.option:disabled{color:#4f635b}.option:not(:disabled):hover{background:#dff0df}
.option b{display:grid;place-items:center;width:24px;height:24px;flex:none;border-radius:5px;background:#e1eee0;color:#175d4e;font-size:.73rem}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
dialog{width:min(calc(100% - 22px),420px);max-height:calc(100dvh - 20px);padding:15px;border:3px solid #e0ca9d;border-radius:13px;color:var(--ink);background:#fffaf0;box-shadow:0 18px 48px #14252765}
dialog::backdrop{background:#192d2aad}dialog h2{font-size:1.3rem;margin:0 0 8px}dialog .main-button{margin-top:10px}
.note{background:#f3ead7;border-left:4px solid #c3985c;border-radius:4px;padding:8px 10px;font-size:.9rem}.note p+p{margin-top:5px;color:#4d5e53}
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.loot{position:relative;display:grid;justify-items:center;min-width:0;background:#f1e7d4;border:1px solid #d5bd96;border-radius:8px;padding:4px 0;font-size:.76rem}.loot:disabled{opacity:.55}.loot.open{opacity:1;background:#efe1f7;border-color:#b49acc}.loot .chest{--size:min(20vw,82px)}
.loot .shard{position:absolute;z-index:4;top:5px;left:42%;animation:rise .3s ease-out}
.reward-line{margin-top:8px;font-size:.85rem;font-weight:850;color:var(--purple)}
.card{display:grid;justify-items:center;place-content:center;gap:7px;margin:9px auto 14px;width:min(190px,65%);aspect-ratio:3/4;transform:rotate(-3deg);border:3px solid #e8c88e;border-radius:14px;color:#fff4da;background:repeating-conic-gradient(from 16deg at 50% 40%,transparent 0deg 22deg,#eac6fd35 23deg 24deg,transparent 25deg 44deg),radial-gradient(at 50% 40%,#8d5eb9,#40245e 57%,#221436);box-shadow:inset 0 0 0 5px #6f548b,5px 6px #382847,6px 9px 15px #392a4b55}
.card .shard{width:58px;height:72px;display:grid;place-items:center;color:white;font-size:1.6rem;font-weight:850}.card small{font-weight:800;color:#f3d6a9}
.summary{display:flex;justify-content:center;gap:9px}.summary div{background:#edf2e5;border-radius:7px;padding:5px 9px;font-size:.72rem;font-weight:800}.summary strong{display:block;font-size:1.2rem}
.log{padding:0;list-style:none;background:#fff7e1;border-radius:7px}.log li{display:flex;justify-content:space-between;gap:7px;padding:5px 8px;border-bottom:1px solid #ead9b8;font-size:.77rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.chest{--size:clamp(159px,53vw,229px);position:relative;display:block;width:var(--size);aspect-ratio:10/8}
.chest span{display:block;position:absolute;inset:0}
.chest .chest-shadow{inset:67% -6% 0;background:radial-gradient(ellipse,#30232a65,transparent 66%);transform:rotate(-4deg)}
.chest-rim{clip-path:polygon(6% 52%,30% 29%,94% 38%,70% 60%);background:linear-gradient(155deg,#8d5131 47%,#e4ad60 48%,#5b3224 64%,#411f1a 72%)}
.chest-light{clip-path:polygon(10% 51%,31% 33%,88% 39%,69% 56%);background:radial-gradient(ellipse at 57% 52%,#ffec9d 0,#e6ab55 13%,#664127 40%,#39201b 66%);opacity:0;transition:opacity .25s}
.chest-front{clip-path:polygon(6% 52%,70% 60%,70% 92%,6% 81%);background:linear-gradient(90deg,#54271b 5%,#edb276 7% 12%,#b47943 14%,transparent 15% 61%,#eab777 63%,#b57740 69%,transparent 71%),repeating-linear-gradient(9deg,#3d190e65 0 2px,transparent 3px 15%),linear-gradient(170deg,#dc9a63 48%,#a55d36 65%,#673820 87%)}
.chest-side{clip-path:polygon(70% 60%,94% 38%,94% 68%,70% 92%);background:linear-gradient(90deg,#7d5534 72%,#c69354 74%,#936337 79%,transparent 81% 88%,#a16a37 90%,#754724 96%),repeating-linear-gradient(137deg,#451f1960 0 2px,transparent 3px 14px),linear-gradient(125deg,#955a39 71%,#572d24 94%)}
.chest-lid{transform-origin:52% 34%;transition:transform .27s ease-out}
.lid-top{clip-path:polygon(6% 45%,9% 33%,29% 15%,89% 23%,94% 31%,70% 52%);background:linear-gradient(145deg,transparent 30%,#eed099 31% 34%,#b57946 35%,transparent 36% 56%,#eaca91 57% 61%,#ad7644 62%,transparent 63%),linear-gradient(164deg,#f0ba7e 19%,#b67241 44%,#734329 63%)}
.lid-edge{clip-path:polygon(6% 44%,70% 52%,70% 61%,6% 52%);background:linear-gradient(90deg,#9e683d 5%,#f7cf91 7% 13%,#bd854e 14%,transparent 16% 59%,#e8ba7a 61% 65%,#a5703f 68%,transparent 71%),linear-gradient(#d58c57 48%,#723d29 59%)}
.lid-side{clip-path:polygon(70% 52%,94% 30%,94% 39%,70% 61%);background:linear-gradient(90deg,#8b5733 70%,#c69459 78%,#744428 87%,#a6703e 91%,#754a31 94%)}
.chest .lock{inset:51% 52% 32% 34%;border-radius:24% 24% 32% 30%;transform:rotate(8deg);background:linear-gradient(135deg,#ffe0a7,#c5853d 61%,#8a5229);border:1px solid #804c23;box-shadow:0 2px 1px #4b271c}
.lock::after{content:"";position:absolute;inset:26% 36% 24%;border-radius:50% 50% 30% 30%;background:#583422}
.open .chest-lid{transform:translate(-4%,-24%) rotate(-19deg)}
.open .chest-light{opacity:1}
.open .lock{transform:translateY(40%) rotate(8deg)}
.treasure .chest{--size:min(20vw,87px)}


.loot .chest{--size:min(20vw,82px)}.open .chest-lid{transform:translate(-4%,-24%) rotate(-19deg)}

:root{color-scheme:dark;--ink:#fff1cc;--muted:#d5a6f4;--paper:#ffedc3;--purple:#e5b7ff}
body{background:#070819}
.game{padding:env(safe-area-inset-top) 13px max(12px,env(safe-area-inset-bottom));gap:11px;background:radial-gradient(ellipse at 50% 6%,#3d2d83,transparent 46%),radial-gradient(ellipse at 50% 100%,#392863,transparent 65%),#10112e}
.game::before{content:"";position:absolute;inset:6px 3px 3px;z-index:-1;border:2px solid #3fdcf9;border-radius:28px;box-shadow:inset 0 0 15px #4da6ff88,0 0 9px #36cdee88;background:repeating-linear-gradient(90deg,#7e299528 0 4px,transparent 28px 42px);pointer-events:none}
.topbar{padding:10px 1px 2px;text-shadow:none}
.badge{padding:3px 9px 4px 4px;border:1px solid #f1ba70;border-radius:10px;background:linear-gradient(#5b245a,#291334);box-shadow:inset 0 0 0 2px #95634665,0 2px 8px #0009;font-weight:950;color:#fff1c9}
.badge b{background:#57368d;border:1px solid #b98fed;color:#f9d9ff}
.album{background:linear-gradient(#4e296f,#221235);border-color:#c19ae2;color:#f4dcff;box-shadow:0 2px 5px #0008;min-height:39px}
.board{border-width:5px;border-color:#db954e;border-top-color:#ffe2a4;border-bottom-color:#9f583d;border-radius:16px;color:#2d1831;background:linear-gradient(180deg,#fff3d4 0%,#ffe5af 49.6%,#d9ad74 49.9%,#ffe7b2 50.5%,#fff0c9 100%);box-shadow:0 0 0 2px #663c57,0 0 0 4px #122842,inset 0 0 12px #9a432754,0 0 20px #ffc25b44;position:relative}
.board-head{background:linear-gradient(#422659,#2e1844);border-bottom:2px solid #c89659;border-radius:10px 10px 0 0;padding:6px 9px}
.board-head p{color:#fff0ca}.route li{background:#2b2045;border-color:#806990;color:#e5d7fc}.route .now{background:#ffcb62;color:#351629;border-color:#ffe7a3}.route .win{background:#168873;color:white;border-color:#68dcbb}
.question-label{background:#6c3f91;color:#fff1dc}.question{font-weight:950;letter-spacing:.005em}
.cover p,.outro p{color:#56394e;font-weight:800}.title{color:#361c43;text-shadow:0 2px #fff6d9}.title span{color:#982943}
.map{border-color:#8b4f71;background:radial-gradient(ellipse,#89418c,#332751 70%);box-shadow:0 3px #6a3b58,inset 0 0 0 2px #e8af6b}.map::before{border:0;background:radial-gradient(circle,#ffd387 1px,transparent 2px) 0 0/19px 17px;opacity:.58}
.desk{background:linear-gradient(152deg,#293c77,#171631 48%,#2a2059);border:2px solid #7064a1;border-bottom:5px solid #373064;border-radius:12px;box-shadow:inset 0 0 12px #12284d,0 4px 13px #050916bb}
.brief{background:#21183a;border-color:#71588f;color:#f0ddf6}.main-button{background:linear-gradient(#087f73,#07574e);border-color:#49c8ae;color:#fff8dd;box-shadow:0 3px #042f34,inset 0 2px #44b4a1b0}
.clock{background:#101027;border:1px solid #a18365;color:#ffcf72;padding:4px 7px;border-radius:9px;grid-template-columns:1fr 36px;text-align:center}
.clock span{font-family:monospace;font-size:1.08rem;letter-spacing:.07em;color:#ffd06c}.clock.urgent span{color:#ff9a81}
.clock progress{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
.bulbs{display:flex;justify-content:space-between;gap:3px}
.bulbs i{display:block;width:min(5.5vw,19px);aspect-ratio:1;border-radius:50%;border:1px solid #775c59;background:radial-gradient(circle at 38% 34%,#685754,#292035 66%)}
.bulbs .lit{border-color:#ffc770;background:radial-gradient(circle at 38% 34%,#fffada 6%,#ffe195 30%,#ffad38 62%,#874026);box-shadow:0 0 6px #ffa339b4}
.option{border:1px solid #d69f69;color:#fff2d8;background:linear-gradient(#685293,#443270);box-shadow:0 2px #291b3b,inset 0 2px #a98dbea0}.option:disabled{color:#eee2ff}.option:not(:disabled):hover{background:linear-gradient(#7760a2,#4d347b)}
.option b{background:#251a43;color:#f8d99a}.binary .option{justify-content:center;min-height:64px;font-size:1.3rem;background:linear-gradient(160deg,#128e83,#095849);box-shadow:0 4px #08362e,inset 0 2px #7de0cf}.binary .option:nth-child(2){background:linear-gradient(160deg,#bc4662,#822944);box-shadow:0 4px #52162a,inset 0 2px #ed9bac}.binary .option b{display:none}
dialog{color:#fff0d1;background:linear-gradient(#322047,#171631);border-color:#ce9d65}.note{background:#ffebbf;color:#321d38}.note p+p{color:#51384d}.reward-line{color:#f0c2ff}
.loot{background:#292045;border-color:#866295;color:#ffeac7}.loot.open{background:#513269;border-color:#d49bed}

<script>
"use strict";
const bank=[{"text":"竹南鎮的面積大約是 37.56 平方公里，西臨臺灣海峽。","options":["是","否"],"answer":0,"explanation":"竹南鎮全鎮面積約 37.56 平方公里，西臨臺灣海峽，北隔中港溪。","category":"地方歷史"},{"text":"清領時期竹南中港地區曾是往來艋舺與鹿港之間的重要河口港市。","options":["是","否"],"answer":0,"explanation":"早期漢人由中港河口上岸墾拓，發展為興盛的河口港市。","category":"地方歷史"},{"text":"山佳考古遺址主體屬於臺灣北部新石器時代中期，距今約 500 年。","options":["是","否"],"answer":1,"explanation":"山佳遺址主體屬新石器時代晚期，距今約 1,800～2,200 年（亦有距今約 3,000 年早期遺跡）。","category":"地方歷史"},{"text":"1889 年（光緒 15 年）新竹與苗栗分界，確立以「中港溪」為天然界線。","options":["是","否"],"answer":0,"explanation":"新竹、苗栗兩縣會勘以中港溪為界，溪北屬新竹、溪南屬苗栗。","category":"地方歷史"},{"text":"竹南火車站最初於 1902 年設站時的名稱叫做「竹南驛」。","options":["是","否"],"answer":1,"explanation":"最初設立時稱為「中港驛」，於 1920 年才更名為「竹南驛」。","category":"鐵道交通"},{"text":"日治時期海線鐵路通車後，竹南車站成為縱貫線山線與海線北端的分歧樞紐。","options":["是","否"],"answer":0,"explanation":"1922 年海線全線通車後，竹南正式成為山海線分歧樞紐。","category":"鐵道交通"},{"text":"崎頂子母隧道是全臺唯一兩座雙軌道相連的舊鐵路隧道。","options":["是","否"],"answer":0,"explanation":"崎頂一號（母）與二號（子）隧道緊鄰，是全臺唯一的雙軌相連舊隧道。","category":"鐵道交通"},{"text":"崎頂一號隧道南口紅磚牆面上的密集成排凹洞，是日治時期的裝飾雕刻。","options":["是","否"],"answer":1,"explanation":"那是太平洋戰爭末期遭美軍戰機追擊掃射留下的真實機槍彈孔。","category":"鐵道交通"},{"text":"清代建立的「中港溪官義渡」規定往來行人須收費才能渡河。","options":["是","否"],"answer":1,"explanation":"官義渡設置後實施「義渡租」制度，規定往來行人隨到隨渡、嚴禁索取分文。","category":"地方歷史"},{"text":"竹南鎮早期的中港古城是以堅固的紅磚砌築高聳的城牆。","options":["是","否"],"answer":1,"explanation":"早期中港城並未以磚石砌牆，而是種植「刺竹」形成防禦牆體。","category":"地方歷史"},{"text":"竹南濱海森林公園屬於編號「1311 號飛沙防止保安林」，具備防風定砂功能。","options":["是","否"],"answer":0,"explanation":"全長約 8 公里、面積約 150 公頃，屬 1311 號飛沙防止保安林。","category":"自然生態"},{"text":"每年 4、5 月造訪竹南保安林的斯氏紫斑蝶，是進行向南遷徙過冬。","options":["是","否"],"answer":1,"explanation":"清明節過後是隨天氣回暖「北飛」抵達竹南繁殖或作為二次遷移的中繼站。","category":"自然生態"},{"text":"攀附在木麻黃樹幹上、提供紫斑蝶幼蟲食用與產卵的植物是羊角藤。","options":["是","否"],"answer":0,"explanation":"羊角藤（蘿藦科）是斯氏紫斑蝶幼蟲的專屬食草。","category":"自然生態"},{"text":"平埔族道卡斯族（Taokas）傳統分佈於大甲溪以北至新竹湖口台地一帶。","options":["是","否"],"answer":0,"explanation":"道卡斯族分佈於大甲溪以北至新竹湖口台地、楊梅高山頂以南。","category":"道卡斯文化"},{"text":"後龍新港社（Totovaken）是全臺平埔族中規模最大的單一部落。","options":["是","否"],"answer":0,"explanation":"新港社為道卡斯族後壠社群中規模最大的部落。","category":"道卡斯文化"},{"text":"道卡斯族的傳統收穫祭又稱為「牽田」（khantian），於每年農曆 7 月及 8 月舉行。","options":["是","否"],"answer":0,"explanation":"與漢人中元節（旗頭）和中秋節（旗尾）時間相近。","category":"道卡斯文化"},{"text":"道卡斯族的「巴代」（Patai）祭祖儀式祭忌極嚴，族人當時可以隨意外出串門子。","options":["是","否"],"answer":1,"explanation":"巴代祭忌極嚴，關閉社門、禁止外人入內，族人不得外出或入他人大廳。","category":"道卡斯文化"},{"text":"竹南中港昔日因盛產金銀紙且家戶曝曬金黃色半成品，享有「金色中港」美譽。","options":["是","否"],"answer":0,"explanation":"全鎮曾高達八成人口從事金紙業，曾有 385 家登記工廠，遍地金黃。","category":"傳統工藝"},{"text":"傳統手工製金紙時，裁切與切割錫箔必須使用金屬鋼刀才不會破損。","options":["是","否"],"answer":1,"explanation":"必須使用非金屬製的「竹刀」切割錫箔，以避免靜電或刮損。","category":"傳統工藝"},{"text":"竹南番社 30 號的陳家古厝建於 1937 年（昭和 12 年），是一座坐東朝西的三合院。","options":["是","否"],"answer":0,"explanation":"因 1935 年關刀山大地震震毀舊土埆厝後，於 1937 年由陳新安兄弟合力重建。","category":"古厝建築"},{"text":"陳家古厝正身屋脊上裝飾的百年花磚，學名為「馬約利卡花磚」（Majolica tile）。","options":["是","否"],"answer":0,"explanation":"源自歐洲、經日本量銷東南亞的百年馬約利卡花磚，古厝正身共裝飾 88 片。","category":"古厝建築"},{"text":"陳家古厝室內傳統隔間採用的「編竹夾泥牆」，材料全取自自然且可回歸自然。","options":["是","否"],"answer":0,"explanation":"以桂竹為骨架，雙面塗抹黏土、禾稈與稻殼混合泥漿，屬環保綠建築。","category":"古厝建築"},{"text":"中港慈裕宮主祀媽祖，是苗栗縣歷史最悠久的媽祖廟，已有 300 多年歷史。","options":["是","否"],"answer":0,"explanation":"慈裕宮擁有 300 多年歷史，於 1985 年指定為縣定古蹟。","category":"廟宇信仰"},{"text":"竹南國民小學的前身「中港公學校」，最早是借用中港慈裕宮的兩廂教室創立的。","options":["是","否"],"answer":0,"explanation":"1898 年於慈裕宮創立，至今竹南國小運動會聖火仍固定自慈裕宮起跑。","category":"在地人物與教育"},{"text":"中港保安宮是道卡斯族中港社公廨獻給漢人後改建的廟宇，具備「番漢共祀」歷史。","options":["是","否"],"answer":0,"explanation":"1765 年頭目林合歡獻出公廨與漢人合建，主祀王爺並具原漢共祀特色。","category":"廟宇信仰"},{"text":"竹南鎮在清領時期行政區劃曾數次變更，1731 年（雍正 9 年）大甲溪以北改隸屬於哪一個行政機構？","options":["臺南府","淡水廳","宜蘭廳","鳳山縣"],"answer":1,"explanation":"雍正 9 年彰化縣大甲溪以北劃歸淡水廳管轄。","category":"地方歷史"},{"text":"竹南鎮內的「山佳考古遺址」主要屬於哪一個歷史時期？","options":["舊石器時代","新石器時代晚期","鐵器時代","日治時期"],"answer":1,"explanation":"山佳遺址主體屬新石器時代晚期，距今約 1,800～2,200 年。","category":"地方歷史"},{"text":"日治時期因客貨運激增，總督府為疏緩鐵路運輸，於 1919 年動工興建哪一條鐵路，使竹南成為分歧樞紐？","options":["臺東線","內灣線","海岸線（海線）","平溪線"],"answer":2,"explanation":"為解決滯貨問題，1919 年動工興建海線，1922 年通車使竹南成為山海線分歧點。","category":"鐵道交通"},{"text":"竹南鎮崎頂子母隧道建造於哪一個年份？","options":["1895 年","1928 年","1945 年","1960 年"],"answer":1,"explanation":"崎頂子母隧道建於 1928 年（昭和 3 年）。","category":"鐵道交通"},{"text":"清代為革除中港溪渡夫勒索弊端，於 1837 年設立「中港溪官義渡」的淡水同知是誰？","options":["曹謹","婁雲","沈葆楨","劉銘傳"],"answer":1,"explanation":"道光 16 年淡水同知婁雲巡視地方並訂立義渡章程與購置義渡田。","category":"地方歷史"},{"text":"竹南中港古城的西門對應現今的哪一座廟宇前方道路？","options":["慈裕宮","保安宮","昭靈宮（眧靈宮）","龍鳳宮"],"answer":2,"explanation":"西門位於中美里昭靈宮前方道路上。","category":"地方歷史"},{"text":"竹南濱海森林公園的三大林區中，下列何者不屬於其中？","options":["長青之森","親子之森","假日之森","櫻花之森"],"answer":3,"explanation":"竹南濱海保安林由北至南分為長青之森、親子之森、假日之森。","category":"自然生態"},{"text":"臺灣平埔族道卡斯族（Taokas）的命名者是哪一位日本學者？","options":["伊能嘉矩","鳥居龍藏","森丑之助","移川子之藏"],"answer":0,"explanation":"日人伊能嘉矩將大甲溪以北的平埔族命名為道卡斯族（Taokas）。","category":"道卡斯文化"},{"text":"後龍新港社牽田祭中，象徵傳遞公文並由年輕男性參與的長距離跑步儀式稱為？","options":["飛番競走","麻達賽跑","勇士跳高","逐鹿之戰"],"answer":1,"explanation":"「麻達」為傳遞公文之善跑青年，傳統由年輕男性跑至造橋祖湖大潭祭祖。","category":"道卡斯文化"},{"text":"竹南中港昔日因金銀紙產業鼎盛而被戲稱為？","options":["地下錢莊","黃金山城","紙業王國","錫箔之都"],"answer":0,"explanation":"因銀紙專供焚燒予祖先與好兄弟，中港曾被戲稱為地下錢莊。","category":"傳統工藝"},{"text":"傳統手工金銀紙製作過程中，用來將大片錫箔裁切整齊的非金屬刀具稱為？","options":["鐵剪","竹刀","木柄刀","銅片刀"],"answer":1,"explanation":"使用竹刀切割錫箔以避免金屬靜電或刮損。","category":"傳統工藝"},{"text":"竹南番社 30 號陳家古厝正身大門上方懸掛的堂號為？","options":["彭城堂","潁川堂","隴西堂","安定堂"],"answer":1,"explanation":"陳姓宗族發源地為河南潁川，故大門懸掛潁川堂。","category":"古厝建築"},{"text":"陳家古厝正身屋脊左右共裝飾了幾片百年馬約利卡花磚？","options":["20 片","44 片","88 片","100 片"],"answer":2,"explanation":"正身屋脊前後各 44 片，合計共 88 片。","category":"古厝建築"},{"text":"下列何者不屬於陳家古厝正廳中樑彩繪或員光所呈現的在地聲景記憶？","options":["槌韻","梵音","浪濤","楹聯"],"answer":2,"explanation":"前廊員光左為「槌韻」（斬紙槌聲）、右為「梵音」（慈蓮禪寺木魚聲）。","category":"古厝建築"},{"text":"中港慈裕宮現存最早、於 1783 年自福建漳州運臺的石雕文物為？","options":["青斗石獅","龍虎堵","虎邊石雕","聖母石像"],"answer":0,"explanation":"前殿中門立有乾隆 48 年青斗石獅，石質細密越摸越光滑。","category":"廟宇信仰"},{"text":"慈裕宮三川門兩側墀頭雕刻的外國紳士與淑女造型，在民間俗稱為？","options":["西洋力士","憨番扛廟角","荷蘭 const chest="<span class=\"chest\" aria-hidden=\"true\"><span class=\"chest-shadow\"></span><span class=\"chest-rim\"></span><span class=\"chest-light\"></span><span class=\"chest-front\"></span><span class=\"chest-side\"></span><span class=\"chest-lid\"><span class=\"lid-top\"></span><span class=\"lid-edge\"></span><span class=\"lid-side\"></span></span><span class=\"lock\"></span></span>";
const key="zhunan-hunt-collection-v1";
const $=selector=>document.querySelector(selector);
const board=$("#board"),desk=$("#desk"),head=$(".board-head"),feedback=$("#feedback"),album=$("#album"),albumButton=$("#album-button");
const motion=matchMedia("(prefers-reduced-motion: reduce)");
const gate=$("#gate"),portrait=matchMedia("(orientation: portrait)");
const isLine=/\bLine\//i.test(navigator.userAgent);
let pausedAt=null;
let inventory=load(),canSave=true,round=[],history=[],index=0,phase="home",deadline,ticker;
function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(key));
    if(Number.isSafeInteger(saved?.fragments)&&saved.fragments>=0&&saved.fragments<100&&Number.isSafeInteger(saved.cards)&&saved.cards>=0)return saved;
  }catch{}
  return {fragments:0,cards:0};
}
function sync(){
  $("#balance").textContent=inventory.fragments+"/100";
  albumButton.setAttribute("aria-label","至尊卡收藏 "+inventory.cards+" 張，碎片 "+inventory.fragments+" / 100");
}
function collect(amount){
  if(canSave)inventory=load();
  const total=inventory.fragments+amount, unlocked=Math.floor(total/100);
  inventory={fragments:total%100,cards:inventory.cards+unlocked};
  try{localStorage.setItem(key,JSON.stringify(inventory));}catch{canSave=false;}
  sync();
  return unlocked;
}
function shuffle(values){
  const items=[...values];
  for(let i=items.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [items[i],items[j]]=[items[j],items[i]];
  }
  return items;
}
function start(){
  if(isLine||!portrait.matches)return;
  const pool=shuffle(bank),byCategory=new Map();
  for(const item of pool)if(!byCategory.has(item.category))byCategory.set(item.category,item);
  const required=[...byCategory.values()];
  round=shuffle(required.concat(pool.filter(item=>!required.includes(item)).slice(0,10-required.length)));
  history=[];index=0;
  openAudio();cue("start");
  albumButton.disabled=true;
  showQuestion();
}
function appendButton(parent,label,onClick,className="main-button"){
  const button=document.createElement("button");
  button.type="button";button.className=className;button.textContent=label;button.onclick=onClick;parent.append(button);
  return button;
}
function card(label){
  return '<div class="card"><span class="shard" aria-hidden="true">竹</span><strong>竹南守護者</strong><small>'+label+'</small></div>';
}
function showAlbum(){
  if(canSave)inventory=load();
  sync();
  album.innerHTML='<h2 id="album-title">至尊卡收藏</h2>'+card(inventory.cards?"已收藏 "+inventory.cards+" 張":"卡面預覽")+
    '<p>碎片 '+inventory.fragments+' / 100，每滿 100 個自動兌換。</p>';
  if(!canSave)album.insertAdjacentHTML("beforeend","<p>此瀏覽器無法儲存收藏。</p>");
  appendButton(album,"返回",()=>album.close());
  album.showModal();fitDialog(album);
}
function route(){
  head.hidden=false;
  head.innerHTML='<p>第 '+(index+1)+' / '+round.length+' 題</p><p></p><ol class="route" aria-label="尋寶進度"></ol>';
  head.querySelector("p:nth-child(2)").textContent=round[index].category;
  const path=head.querySelector(".route");
  round.forEach((item,i)=>{
    const stop=document.createElement("li"), status=history[i]?.status;
    stop.className=status||(i===index?"now":"");
    if(i===index&&!status)stop.setAttribute("aria-current","step");
    stop.textContent=status==="win"?"✓":status==="miss"?"×":status==="late"?"◷":i+1;
    stop.setAttribute("aria-label","第 "+(i+1)+" 站"+(status==="win"?"答對":status==="miss"?"答錯":status==="late"?"逾時":""));
    path.append(stop);
  });
}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function showQuestion(){
  phase="reveal";
  $(".game").dataset.screen="quiz";
  const item=round[index];
  route();
  board.innerHTML='<p class="question-label"></p><h2 class="question" tabindex="-1"><span aria-hidden="true"></span></h2>';
  desk.innerHTML='<div class="clock"><progress max="10" value="10" aria-label="剩餘作答時間"></progress><div class="bulbs" aria-hidden="true"></div><span>待機</span></div><div class="choices"></div>';
  const bulbs=desk.querySelector(".bulbs");
  for(let i=0;i<10;i++)bulbs.append(document.createElement("i"));
  board.scrollTop=0;desk.scrollTop=0;
  head.querySelector("p:nth-child(2)").textContent=item.category;
  board.firstElementChild.hidden=true;
  const question=board.querySelector("h2"),letters=question.firstElementChild;
  question.setAttribute("aria-label",item.text);
  fitQuestion();
  question.focus({preventScroll:true});
  if(motion.matches)letters.textContent=item.text;
  else for(const letter of item.text){letters.textContent+=letter;await wait(85);}
  const choices=desk.querySelector(".choices");
  choices.classList.toggle("binary",item.options.length===2);
  const options=item.options.map((text,i)=>{
    const option=appendButton(choices,"",()=>answer(i),"option");
    option.hidden=option.disabled=true;
    const badge=document.createElement("b"),label=document.createElement("span");
    badge.textContent=item.options.length===2?["✓","×"][i]:"ABCD"[i];
    badge.setAttribute("aria-hidden","true");
    label.textContent=text;option.append(badge,label);
    return option;
  });
  fitOptions();
  for(const option of options){await wait(330);option.hidden=false;cue("option");}
  await wait(180);
  deadline=performance.now()+10000;phase="answer";
  if(!portrait.matches)pausedAt=performance.now();
  for(const option of options)option.disabled=false;
  ticker=setInterval(updateClock,40);
  updateClock();
}
function updateClock(){
  if(pausedAt!==null)return;
  const remaining=Math.max(0,deadline-performance.now());
  const clock=desk.querySelector(".clock");
  clock.querySelector("progress").value=remaining/1000;
  const seconds=Math.ceil(remaining/1000);
  paintClock(seconds);
  clock.classList.toggle("urgent",remaining<=3000);
  if(!remaining)answer(null);
}
function paintClock(seconds){
  const clock=desk.querySelector(".clock");
  const display=clock.querySelector("span");
  if(seconds!==lastSecond&&seconds>=1&&seconds<=3&&phase==="answer")cue("tick");
  lastSecond=seconds;
  display.textContent=String(seconds).padStart(2,"0");
  clock.querySelectorAll(".bulbs i").forEach((bulb,i)=>bulb.classList.toggle("lit",i<seconds));
}
function answer(selected){
  if(phase!=="answer"||pausedAt!==null||!portrait.matches)return;
  phase="feedback";clearInterval(ticker);
  if(performance.now()>=deadline)selected=null;
  if(selected===null){
    desk.querySelector("progress").value=0;
    paintClock(0);
  }
  const item=round[index],correct=selected===item.answer;
  cue(correct?"correct":selected===null?"late":"wrong");
  history.push({status:correct?"win":selected===null?"late":"miss",fragments:0});
  desk.querySelectorAll(".option").forEach(option=>option.disabled=true);
  route();
  feedback.innerHTML='<h2 id="feedback-title" tabindex="-1"></h2><div class="note"><p><strong></strong></p><p class="detail"></p></div><div id="feedback-actions"></div>';
  const title=feedback.querySelector("h2");
  title.textContent=correct?"答對了！":selected===null?"時間到！":"答錯了";
  feedback.querySelector("strong").textContent="正確答案是「"+item.options[item.answer]+"」";
  feedback.querySelector(".detail").textContent=item.explanation;
  const actions=feedback.querySelector("#feedback-actions");
  if(correct)treasure(actions);else onward(actions);
  feedback.showModal();fitDialog(feedback);title.focus({preventScroll:true});
}
function treasure(area){

  const boxes=area.querySelector(".rewards");
  shuffle([1,2,3]).forEach((amount,i)=>{
    const box=appendButton(boxes,"",()=>{
      for(const choice of boxes.children)choice.disabled=true;

      const message=area.querySelector('[role="status"]');

      message.textContent="取得 "+amount+" 個碎片"+(unlocked?"，已解鎖「竹南守護者」！":"！");
      if(unlocked)area.insertAdjacentHTML("beforeend",card("已解鎖"));
      if(!canSave)area.insertAdjacentHTML("beforeend","<p>收藏只保留到關閉本頁。</p>");
      const next=onward(area);
      fitDialog(feedback);next.focus({preventScroll:true});
    },"loot");
    box.innerHTML=chest+"寶箱 "+(i+1);
  });
}
function onward(area){
  return appendButton(area,index+1===round.length?"查看探險紀錄":"前往下一站　→",()=>{
    feedback.close();index++;
    if(index===round.length)finish();else showQuestion();
  });
}
function finish(){
  phase="result";cue("finish");$(".game").dataset.screen="result";albumButton.disabled=false;head.hidden=true;
  const wins=history.filter(item=>item.status==="win").length,total=history.reduce((sum,item)=>sum+item.fragments,0);
  board.innerHTML='<div class="outro"><h2 tabindex="-1">探險完成</h2><div class="summary"><div><strong>'+wins+' / '+round.length+'</strong>答對題數</div><div><strong>+'+total+'</strong>至尊卡碎片</div></div></div>';
  desk.replaceChildren();
  appendButton(desk,"再走一趟　→",start);
  const log=document.createElement("ol");log.className="log";log.setAttribute("aria-label","各站探險紀錄");
  round.forEach((item,i)=>{
    const row=document.createElement("li"),label=document.createElement("strong"),result=document.createElement("span");
    label.textContent=(i+1)+"　"+item.category;
    result.textContent=history[i].status==="win"?"✓　+"+history[i].fragments+" 碎片":history[i].status==="late"?"逾時":"答錯";
    row.append(label,result);log.append(row);
  });
  desk.append(log);
  const pages=document.createElement("div");pages.className="result-pages";
  let current=0;
  const next=appendButton(pages,"",()=>{current=(current+1)%3;showLogPage();});
  function showLogPage(){
    [...log.children].forEach((row,i)=>{row.hidden=Math.floor(i/4)!==current;});
    next.textContent="紀錄 "+(current+1)+" / 3　→";
  }
  desk.append(pages);showLogPage();
  board.querySelector("h2").focus({preventScroll:true});
}
function fitQuestion(){
  const question=board.querySelector(".question");
  if(!question)return;
  const letters=question.firstElementChild,visible=letters.textContent;
  question.style.fontSize="";
  letters.textContent=round[index].text;
  const body=board;
  const bodyStyle=getComputedStyle(body);
  const height=board.clientHeight-parseFloat(bodyStyle.paddingTop)-parseFloat(bodyStyle.paddingBottom);
  let size=parseFloat(getComputedStyle(question).fontSize);
  while(question.scrollHeight>height+1&&size>10)question.style.fontSize=(--size)+"px";
  letters.textContent=visible;
}
function fitOptions(){
  const choices=desk.querySelector(".choices");
  if(!choices||choices.classList.contains("binary"))return;
  const options=[...choices.children];
  for(const option of options){
    const hidden=option.hidden;
    if(hidden){option.style.visibility="hidden";option.hidden=false;}
    const label=option.querySelector("span");
    option.style.fontSize="";
    let size=parseFloat(getComputedStyle(option).fontSize);
    const style=getComputedStyle(option);
    const height=option.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom);
    while((label.scrollHeight>height || label.scrollWidth>label.clientWidth+1)&&size>9)option.style.fontSize=(--size)+"px";
    option.hidden=hidden;option.style.visibility="";
  }
}
function fitDialog(dialog){
  if(!dialog.open)return;
  dialog.style.zoom="";
  const height=dialog.scrollHeight+6;
  const limit=window.innerHeight-16;
  if(height>limit)dialog.style.zoom=String(limit/height);
}
function updateGate(){
  const locked=isLine||!portrait.matches;
  $(".game").inert=locked;syncSound();
  if(locked){
    if(phase==="answer"&&pausedAt===null)pausedAt=performance.now();
    gate.querySelector("h2").textContent=isLine?"請用系統瀏覽器開啟":"請轉回直式";
    const link=gate.querySelector("a");
    link.hidden=true;
    if(isLine && /^https?:$/.test(location.protocol)){
      const url=new URL(location.href);url.searchParams.set("openExternalBrowser","1");
      link.href=url.href;link.hidden=false;
    }
    gate.querySelector("p").textContent=isLine?(link.hidden?"請從系統瀏覽器開啟這個 HTML 檔。":"若未跳轉，請從 LINE 選單選擇「以外部瀏覽器開啟」。"):"將手機直立即可繼續遊戲。";
    if(!gate.open)gate.showModal();
    return;
  }
  if(gate.open)gate.close();
  if(pausedAt!==null){deadline+=performance.now()-pausedAt;pausedAt=null;}
  fitQuestion();fitOptions();fitDialog(feedback);fitDialog(album);
}
gate.addEventListener("cancel",event=>event.preventDefault());
portrait.addEventListener("change",updateGate);
window.addEventListener("resize",updateGate);
feedback.addEventListener("cancel",event=>event.preventDefault());
albumButton.onclick=showAlbum;
sync();
board.innerHTML='<div class="cover"><h1 class="title">竹南文化問答秀</h1><p>答對開箱，集滿碎片解鎖至尊卡。</p></div>';
desk.innerHTML='<div class="launch"><p class="brief">每站有 10 秒作答。答對就能開箱，集滿 100 個碎片兌換「竹南守護者」至尊卡。</p></div>';
appendButton(desk.firstElementChild,"開始挑戰　▶",start);
const sound=$("#sound");
const preference="zhunan-hunt-muted";
let audio,music,effects,timer,nextNote,step=0,lastSecond=0,muted=false;
try{muted=localStorage.getItem(preference)==="1";}catch{}
const melody=[72,0,76,79,74,0,76,0,72,76,81,79,76,0,74,0,69,0,72,76,74,0,72,0,67,71,74,76,79,0,74,0];
const jingles={start:[67,72,76],option:[83],tick:[88],correct:[72,76,79,84],wrong:[61,56],late:[65,60,53],chest:[72,79,84,88],card:[72,76,79,84,88,91],finish:[60,67,72,76,84]};
function canPlay(){return !muted&&!document.hidden&&!isLine&&portrait.matches;}
function openAudio(){
  if(!canPlay())return;
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return;
  try{
    if(!audio){
      audio=new Context();music=audio.createGain();effects=audio.createGain();
      music.connect(audio.destination);effects.connect(audio.destination);
    }
    audio.resume().then(syncSound).catch(()=>{});
    syncSound();
  }catch{}
}
function syncSound(){
  if(!audio)return;
  const active=canPlay();
  music.gain.value=active ? .32 : 0;effects.gain.value=active ? .57 : 0;
  if(!active){clearInterval(timer);timer=null;return;}
  if(audio.state!=="running"||timer)return;
  nextNote=audio.currentTime+.04;timer=setInterval(schedule,45);schedule();
}
function note(bus,pitch,when,length,volume,type){
  const wave=audio.createOscillator(),env=audio.createGain();
  wave.type=type;wave.frequency.value=440*2**((pitch-69)/12);
  env.gain.setValueAtTime(.0001,when);
  env.gain.exponentialRampToValueAtTime(volume,when+.012);
  env.gain.exponentialRampToValueAtTime(.0001,when+length);
  wave.connect(env);env.connect(bus);wave.start(when);wave.stop(when+length+.02);
}
function schedule(){
  if(audio.state!=="running")return;
  if(nextNote<audio.currentTime)nextNote=audio.currentTime+.025;
  while(nextNote<audio.currentTime+.13){
    const position=step%melody.length;
    if(melody[position])note(music,melody[position],nextNote,.14,.074,"square");
    if(position%2===0)note(music,[48,45,53,55][Math.floor(position/8)]+(position%4===2?7:0),nextNote,.21,.15,"triangle");
    nextNote+=.205;step++;
  }
}
function cue(name){
  if(!audio||!canPlay()||audio.state!=="running")return;
  const quiet=name==="option"||name==="tick";
  jingles[name].forEach((pitch,i)=>note(effects,pitch,audio.currentTime+.02+i*.08,quiet?.09:.22,quiet?.1:.16,quiet?"square":"triangle"));
}
function labelSound(){
  sound.textContent=muted?"♫×":"♫";
  sound.setAttribute("aria-pressed",String(!muted));
  sound.title=muted?"開啟音訊":"靜音";
}
sound.onclick=()=>{
  muted=!muted;
  try{localStorage.setItem(preference,muted?"1":"0");}catch{}
  labelSound();syncSound();if(!muted)openAudio();
};
document.addEventListener("visibilitychange",syncSound);
labelSound();
updateGate();
</script>
</body>
</html>
